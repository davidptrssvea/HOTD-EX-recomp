name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

concurrency:
  group: hotdex-release
  cancel-in-progress: false

jobs:
  windows-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test complete display menus and saved preferences
        shell: powershell
        run: ./.release/test_display_controls.ps1
      - name: Test update progress, window switching and cancellation
        shell: powershell
        run: ./.release/test_update_progress.ps1
      - name: Test remembered Setup folders and Browse controls
        shell: powershell
        run: ./.release/test_setup_paths.ps1
  publish:
    needs: windows-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the exact tagged version
        id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            tag="$(tr -d '\r\n' < ui/hotd-update-version.txt)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if ! git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null; then
            echo "No source tag for $tag yet."
            exit 0
          fi
          git checkout --detach "refs/tags/$tag^{commit}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and verify the source-only release
        if: steps.version.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 .release/package.py "$RELEASE_TAG" "$RUNNER_TEMP"
      - name: Publish the verified package
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" = false ]; then
            echo "$RELEASE_TAG is already published."
            exit 0
          fi
          name="HOTDEX-Local-Builder-$RELEASE_TAG.zip"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$name" "$RUNNER_TEMP/$name.sha256" \
            --verify-tag --draft --title "HOTD EX Local Builder $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
